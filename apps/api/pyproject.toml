[project]
name = "visara-api"
version = "0.1.0"
description = "FastAPI backend scaffold for the Visara clinical decision-support platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "boto3>=1.35.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "httpx>=0.28.0",
  "numpy>=2.1.2",
  "pillow>=11.0.0",
  "pydicom>=3.0.1",
  "pydantic-settings>=2.6.1",
  "PyJWT>=2.10.1",
  "python-multipart>=0.0.17",
  "reportlab>=4.2.5",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4.0",
  "torch>=2.5.1",
  "uvicorn[standard]>=0.32.0",
  "weasyprint>=62.3",
]

[project.optional-dependencies]
dev = [
  "asgi-lifespan>=2.1.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
