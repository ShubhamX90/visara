services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      VISARA_DATABASE_URL: postgresql+asyncpg://visara:visara@db:5432/visara
      VISARA_SECRET_KEY: change-me-in-production
      VISARA_STORAGE_TYPE: s3
      VISARA_STORAGE_BUCKET: visara
      VISARA_STORAGE_ENDPOINT_URL: http://storage:9000
      VISARA_STORAGE_ACCESS_KEY: minioadmin
      VISARA_STORAGE_SECRET_KEY: minioadmin123
      VISARA_STORAGE_SECURE: "false"
      VISARA_GPU_ENABLED: "false"
      VISARA_MODEL_CHECKPOINT_PATH: /app/model_assets/checkpoints/visara.ckpt
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "8000:8000"
    volumes:
      - ./model_assets:/app/model_assets:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: visara
      POSTGRES_USER: visara
      POSTGRES_PASSWORD: visara
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visara -d visara"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  storage:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
